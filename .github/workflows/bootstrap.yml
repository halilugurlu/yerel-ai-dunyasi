name: Yerel AI Dünyası Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  LLAMA_CPP_REF: "v0.4.1"
  ANDROID_NDK_VERSION: "29.0.13113456"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM: "36"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Proje ZIP dosyasını aç
        shell: bash
        run: |
          set -euxo pipefail

          test -f yerel_ai_dunyasi_v007.zip

          rm -rf work
          mkdir -p work

          unzip -q yerel_ai_dunyasi_v007.zip -d work

          test -f work/yerel_ai_dunyasi_v007/project.godot

          echo "Proje ZIP dosyası başarıyla açıldı."

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Android SDK ortamını hazırla
        shell: bash
        run: |
          set -euxo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Android lisanslarını kabul et
        shell: bash
        run: |
          set -euxo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK lisans işlemi tamamlandı."

      - name: Android bileşenlerini kur
        shell: bash
        run: |
          set -euxo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "Android SDK/NDK bileşenleri kuruldu."

          "$SDKMANAGER" --list_installed

      - name: Godot motorunu indir
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/bin"

          GODOT_BIN="$(find "$HOME/bin" -type f -name 'Godot_v*-stable_linux.x86_64' | head -1)"

          test -n "$GODOT_BIN"
          test -f "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Godot Android export şablonlarını indir
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot_templates

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          test -d /tmp/godot_templates/templates

          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Godot Android export şablonları hazır."

      - name: Proje dosyalarını doğrula
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          test -f project.godot
          test -f export_presets.cfg

          python3 tools/validate_project.py
          python3 tools/check_engineering_math.py
          python3 tools/verify_android_contract.py

          echo "Proje doğrulamaları tamamlandı."

      - name: Android native AI köprüsünü hazırla ve APK üret
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        env:
          LLAMA_CPP_REF: ${{ env.LLAMA_CPP_REF }}
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"

          mkdir -p build

          bash tools/build_android_debug.sh

          test -s build/yerel-ai-dunyasi-v007-debug.apk

          echo "APK başarıyla üretildi."

          ls -lh build/yerel-ai-dunyasi-v007-debug.apk

      - name: APK SHA-256 oluştur
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum \
            build/yerel-ai-dunyasi-v007-debug.apk \
            > build/yerel-ai-dunyasi-v007-debug.apk.sha256

          cat build/yerel-ai-dunyasi-v007-debug.apk.sha256

      - name: APK dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: yerel-ai-dunyasi-v007-android-debug
          path: |
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
