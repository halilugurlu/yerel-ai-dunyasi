name: Yerel AI Dünyası Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  LLAMA_CPP_REF: "v0.4.1"
  ANDROID_NDK_VERSION: "29.0.13113456"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Proje ZIP dosyasını aç
        run: |
          set -euxo pipefail
          test -f yerel_ai_dunyasi_v007.zip
          mkdir -p work
          unzip -q yerel_ai_dunyasi_v007.zip -d work
          test -f work/yerel_ai_dunyasi_v007/project.godot

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android bileşenlerini kur
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Godot ve Android export şablonlarını kur
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/bin"

          GODOT_BIN="$(find "$HOME/bin" -type f -name 'Godot_v*-stable_linux.x86_64' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -fL --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          cp -a /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Projeyi doğrula ve APK üret
        working-directory: work/yerel_ai_dunyasi_v007
        env:
          LLAMA_CPP_REF: ${{ env.LLAMA_CPP_REF }}
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"

          python3 tools/validate_project.py
          python3 tools/check_engineering_math.py
          python3 tools/verify_android_contract.py

          bash tools/build_android_debug.sh

          test -s build/yerel-ai-dunyasi-v007-debug.apk

          sha256sum \
            build/yerel-ai-dunyasi-v007-debug.apk \
            > build/yerel-ai-dunyasi-v007-debug.apk.sha256

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yerel-ai-dunyasi-v007-android-debug
          path: |
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
