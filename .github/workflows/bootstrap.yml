name: Yerel AI Dünyası Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  LLAMA_CPP_REF: "v0.4.1"
  ANDROID_NDK_VERSION: "29.0.13113456"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Düzeltilmiş proje ZIP dosyasını aç
        shell: bash
        run: |
          set -euxo pipefail

          test -f yerel_ai_dunyasi_v007.zip

          rm -rf work
          mkdir -p work

          unzip -q yerel_ai_dunyasi_v007.zip -d work

          test -f work/yerel_ai_dunyasi_v007/project.godot
          test -f work/yerel_ai_dunyasi_v007/tools/ci_android_debug.sh

          echo "Proje başarıyla açıldı."

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Android APK derle
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        env:
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
          LLAMA_CPP_REF: ${{ env.LLAMA_CPP_REF }}
          ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
          ANDROID_CMAKE_VERSION: ${{ env.ANDROID_CMAKE_VERSION }}
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
        run: |
          set -euxo pipefail

          chmod +x tools/ci_android_debug.sh
          chmod +x android_plugin/build_and_install.sh
          chmod +x android_plugin/prepare_llama_android.sh

          timeout 105m bash tools/ci_android_debug.sh

          test -s build/yerel-ai-dunyasi-v008-debug.apk
          test -s build/yerel-ai-dunyasi-v008-debug.apk.sha256

          echo "APK başarıyla üretildi."
          ls -lh build/yerel-ai-dunyasi-v008-debug.apk
          cat build/yerel-ai-dunyasi-v008-debug.apk.sha256

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yerel-ai-dunyasi-v008-android-debug
          path: |
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v008-debug.apk
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v008-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
