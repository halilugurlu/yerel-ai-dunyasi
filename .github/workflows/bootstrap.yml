name: Yerel AI Dünyası Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  LLAMA_CPP_REF: "v0.4.1"
  ANDROID_NDK_VERSION: "29.0.13113456"
  ANDROID_CMAKE_VERSION: "3.31.6"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM: "36"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Proje ZIP dosyasını aç
        shell: bash
        run: |
          set -euxo pipefail
          test -f yerel_ai_dunyasi_v007.zip
          rm -rf work
          mkdir -p work
          unzip -q yerel_ai_dunyasi_v007.zip -d work
          test -f work/yerel_ai_dunyasi_v007/project.godot

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Android SDK ortamını hazırla
        shell: bash
        run: |
          set -euxo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi

          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Android lisanslarını kabul et
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Android bileşenlerini kur
        shell: bash
        run: |
          set -euxo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Godot motorunu indir
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/bin"

          GODOT_BIN="$(find "$HOME/bin" -type f -name 'Godot_v*-stable_linux.x86_64' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Godot Android export şablonlarını indir
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR" /tmp/godot_templates
          mkdir -p "$TEMPLATE_DIR" /tmp/godot_templates

          curl -fL --retry 5 --retry-delay 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Proje dosyalarını doğrula
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          python3 tools/validate_project.py
          python3 tools/check_engineering_math.py
          python3 tools/verify_android_contract.py

      - name: llama.cpp v0.4.1 kaynağını hızlı indir
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          PLUGIN_ROOT="$PWD/android_plugin"
          THIRD_PARTY="$PLUGIN_ROOT/.third_party"
          LLAMA_DIR="$THIRD_PARTY/llama.cpp"

          rm -rf "$THIRD_PARTY"
          mkdir -p "$THIRD_PARTY" "$PLUGIN_ROOT/plugin/libs"

          git clone \
            --depth 1 \
            --branch "$LLAMA_CPP_REF" \
            --single-branch \
            https://github.com/ggml-org/llama.cpp.git \
            "$LLAMA_DIR"

          test -f "$LLAMA_DIR/examples/llama.android/lib/build.gradle.kts"
          chmod +x "$LLAMA_DIR/examples/llama.android/gradlew"

          git -C "$LLAMA_DIR" rev-parse HEAD > "$PLUGIN_ROOT/LLAMA_CPP_REVISION.txt"

      - name: llama.cpp Android yapısını yalnız ARM64 ile sınırla
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          FILE="android_plugin/.third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = 'abiFilters += listOf("arm64-v8a", "x86_64")'
          new = 'abiFilters += listOf("arm64-v8a")'

          if old not in s:
              raise SystemExit("Beklenen ABI satırı bulunamadı.")

          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: llama.cpp Android AAR derle
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          LLAMA_ROOT="$PWD/android_plugin/.third_party/llama.cpp"

          cd "$LLAMA_ROOT/examples/llama.android"

          timeout 30m ./gradlew :lib:assembleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers="$(nproc)"

          SOURCE_AAR="$LLAMA_ROOT/examples/llama.android/lib/build/outputs/aar/lib-release.aar"
          test -s "$SOURCE_AAR"

          cp "$SOURCE_AAR" \
            "$GITHUB_WORKSPACE/work/yerel_ai_dunyasi_v007/android_plugin/plugin/libs/llama-android-release.aar"

      - name: Godot Yerel AI eklentisini yalnız debug için derle
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          PLUGIN_ROOT="$PWD/android_plugin"
          LLAMA_ROOT="$PLUGIN_ROOT/.third_party/llama.cpp"

          timeout 15m "$LLAMA_ROOT/examples/llama.android/gradlew" \
            -p "$PLUGIN_ROOT" \
            :plugin:installDebugToGodot \
            --no-daemon \
            --stacktrace \
            --max-workers="$(nproc)"

          test -s addons/YerelAIBackend/bin/debug/YerelAIBackend-debug.aar
          test -s addons/YerelAIBackend/bin/debug/llama-android-release.aar

      - name: Android ön kontrol
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          python3 tools/android_preflight.py --strict

      - name: Android build template kur ve APK üret
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export JAVA_HOME="$JAVA_HOME"

          mkdir -p build

          timeout 25m "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$PWD" \
            --install-android-build-template \
            --export-debug "Android Debug" \
            "$PWD/build/yerel-ai-dunyasi-v007-debug.apk"

          test -s build/yerel-ai-dunyasi-v007-debug.apk
          ls -lh build/yerel-ai-dunyasi-v007-debug.apk

      - name: APK SHA-256 oluştur
        working-directory: work/yerel_ai_dunyasi_v007
        shell: bash
        run: |
          set -euxo pipefail

          sha256sum build/yerel-ai-dunyasi-v007-debug.apk \
            > build/yerel-ai-dunyasi-v007-debug.apk.sha256

          cat build/yerel-ai-dunyasi-v007-debug.apk.sha256

      - name: APK dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: yerel-ai-dunyasi-v007-android-debug
          path: |
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk
            work/yerel_ai_dunyasi_v007/build/yerel-ai-dunyasi-v007-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
